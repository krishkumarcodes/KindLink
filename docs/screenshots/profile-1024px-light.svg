
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 900" width="1024" height="900" dir="ltr" fill="none">
      <defs>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0F766E" />
          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
      </defs>

      <!-- Canvas Background -->
      <rect width="1024" height="900" fill="#F8FAFC" />

      <!-- Desktop Sidebar (>=1024px) -->
      
        <g transform="translate(0, 64)">
          <rect width="240" height="836" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
          <text x="24" y="32" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">MENU</text>
          
          <rect x="16" y="50" width="208" height="42" rx="12" fill="#0D9488" fill-opacity="0.18" />
          <text x="48" y="76" fill="#2DD4BF" font-size="13" font-weight="700">Home</text>
          
          <text x="48" y="122" fill="#64748B" font-size="13" font-weight="600">Requests</text>
          <text x="48" y="168" fill="#64748B" font-size="13" font-weight="600">Live Map</text>
          <text x="48" y="214" fill="#64748B" font-size="13" font-weight="600">Profile</text>
          <text x="48" y="260" fill="#64748B" font-size="13" font-weight="600">Settings</text>
        </g>
      

      <!-- Top Header (Height 64px) -->
      <rect width="1024" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(24, 14)">
        <rect width="36" height="36" rx="10" fill="url(#headerGrad)" />
        <circle cx="18" cy="18" r="6" fill="#FFFFFF" />
        
        <text x="44" y="24" fill="#0F172A" font-size="18" font-weight="800" font-family="system-ui, sans-serif">
          Kind<tspan fill="#0D9488">Link</tspan>
        </text>

        <!-- Location Chip -->
        <g transform="translate(145, 4)">
          <rect width="140" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
          <circle cx="12" cy="14" r="3" fill="#10B981" />
          <text x="22" y="18" fill="#0F172A" font-size="10" font-weight="600">Asansol, WB</text>
        </g>
      </g>

      <!-- Right Header Actions (Fit tested at 360px) -->
      <g transform="translate(784, 14)">
        <!-- SOS Circle -->
        <circle cx="18" cy="18" r="18" fill="#DC2626" />
        <circle cx="18" cy="18" r="22" stroke="#DC2626" stroke-opacity="0.3" stroke-width="2" />
        <text x="9" y="22" fill="#FFFFFF" font-size="9" font-weight="900">SOS</text>

        <!-- Language Button -->
        <rect x="42" y="0" width="46" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="56" y="22" fill="#0F172A" font-size="11" font-weight="800">EN</text>

        <!-- Notifications Bell -->
        <rect x="96" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
        <circle cx="114" cy="18" r="7" fill="#64748B" />
        <circle cx="122" cy="10" r="4" fill="#EF4444" />

        <!-- Avatar -->
        <rect x="140" y="0" width="36" height="36" rx="10" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-opacity="0.4" />
        <text x="150" y="23" fill="#2DD4BF" font-size="12" font-weight="800">KV</text>
      </g>

      <!-- Main Stage View Content -->
      <g transform="translate(240, 0)">
        
      <g transform="translate(32, 80)">
        <!-- Profile Header Card -->
        <rect width="728" height="110" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <circle cx="56" cy="55" r="30" fill="#0D9488" />
        <text x="44" y="62" fill="#FFFFFF" font-size="20" font-weight="800">KV</text>
        <text x="100" y="44" fill="#0F172A" font-size="17" font-weight="800">Kind Volunteer</text>
        <text x="100" y="66" fill="#34D399" font-size="11" font-weight="700">✓ Verified Asansol Volunteer</text>
        <text x="100" y="86" fill="#64748B" font-size="11">⭐ 4.95 Rating · 24 Completed Acts of Aid</text>

        <!-- Tabs Row -->
        <g transform="translate(0, 126)">
          <rect x="0" y="0" width="82" height="32" rx="12" fill="#0D9488" />
          <text x="14" y="20" fill="#FFFFFF" font-size="11" font-weight="700">Overview</text>

          <rect x="90" y="0" width="76" height="32" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="106" y="20" fill="#64748B" font-size="11" font-weight="600">Activity</text>

          <rect x="174" y="0" width="76" height="32" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="192" y="20" fill="#64748B" font-size="11" font-weight="600">Badges</text>

          <rect x="258" y="0" width="76" height="32" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="276" y="20" fill="#64748B" font-size="11" font-weight="600">Impact</text>
        </g>

        <!-- Earned Badges Showcase -->
        <g transform="translate(0, 180)">
          <text x="0" y="16" fill="#0F172A" font-size="13" font-weight="800">EARNED COMMUNITY BADGES</text>
          <g transform="translate(0, 32)">
            
              <g transform="translate(0, 0)">
                <rect width="728" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" />
                <circle cx="36" cy="35" r="18" fill="#EF4444" fill-opacity="0.2" />
                <circle cx="36" cy="35" r="10" fill="#EF4444" />
                <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Lifesaver Donor</text>
                <text x="68" y="52" fill="#64748B" font-size="11">5+ verified blood units delivered</text>
              </g>
            
              <g transform="translate(0, 82)">
                <rect width="728" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" />
                <circle cx="36" cy="35" r="18" fill="#F59E0B" fill-opacity="0.2" />
                <circle cx="36" cy="35" r="10" fill="#F59E0B" />
                <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">First Responder</text>
                <text x="68" y="52" fill="#64748B" font-size="11">Emergency response under 10 min</text>
              </g>
            
              <g transform="translate(0, 164)">
                <rect width="728" height="70" rx="18" fill="#FFFFFF" stroke="#E2E8F0" />
                <circle cx="36" cy="35" r="18" fill="#10B981" fill-opacity="0.2" />
                <circle cx="36" cy="35" r="10" fill="#10B981" />
                <text x="68" y="32" fill="#0F172A" font-size="13" font-weight="700">Student Verified</text>
                <text x="68" y="52" fill="#64748B" font-size="11">AEC College ID authenticated</text>
              </g>
            
          </g>
        </g>
      </g>
    
      </g>

      <!-- Mobile Bottom Tab Bar (<768px) with pb-36 clearance buffer -->
      
    </svg>
  