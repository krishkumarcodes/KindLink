
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1080" width="1024" height="1080" dir="ltr" fill="none">
      <defs>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0F766E" />
          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
      </defs>

      <!-- Canvas Background -->
      <rect width="1024" height="1080" fill="#F8FAFC" />

      <!-- Desktop Sidebar (>=1024px) -->
      
        <g transform="translate(0, 64)">
          <rect width="240" height="1016" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
          <text x="24" y="32" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">MENU</text>
          
          <rect x="16" y="50" width="208" height="42" rx="12" fill="#0D9488" fill-opacity="0.18" />
          <text x="48" y="76" fill="#2DD4BF" font-size="13" font-weight="700">Home</text>
          
          <text x="48" y="122" fill="#64748B" font-size="13" font-weight="600">Requests</text>
          <text x="48" y="168" fill="#64748B" font-size="13" font-weight="600">Live Map</text>
          <text x="48" y="214" fill="#64748B" font-size="13" font-weight="600">Profile</text>
          <text x="48" y="260" fill="#64748B" font-size="13" font-weight="600">Settings</text>
        </g>
      

      <!-- Top Header (Height 64px) -->
      <rect width="1024" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <g transform="translate(24, 14)">
        <rect width="36" height="36" rx="10" fill="url(#headerGrad)" />
        <circle cx="18" cy="18" r="6" fill="#FFFFFF" />
        
        <text x="44" y="24" fill="#0F172A" font-size="18" font-weight="800" font-family="system-ui, sans-serif">
          Kind<tspan fill="#0D9488">Link</tspan>
        </text>

        <!-- Location Chip -->
        <g transform="translate(145, 4)">
          <rect width="140" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
          <circle cx="12" cy="14" r="3" fill="#10B981" />
          <text x="22" y="18" fill="#0F172A" font-size="10" font-weight="600">Asansol, WB</text>
        </g>
      </g>

      <!-- Right Header Actions (Fit tested at 360px) -->
      <g transform="translate(784, 14)">
        <!-- SOS Circle -->
        <circle cx="18" cy="18" r="18" fill="#DC2626" />
        <circle cx="18" cy="18" r="22" stroke="#DC2626" stroke-opacity="0.3" stroke-width="2" />
        <text x="9" y="22" fill="#FFFFFF" font-size="9" font-weight="900">SOS</text>

        <!-- Language Button -->
        <rect x="42" y="0" width="46" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="56" y="22" fill="#0F172A" font-size="11" font-weight="800">EN</text>

        <!-- Notifications Bell -->
        <rect x="96" y="0" width="36" height="36" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
        <circle cx="114" cy="18" r="7" fill="#64748B" />
        <circle cx="122" cy="10" r="4" fill="#EF4444" />

        <!-- Avatar -->
        <rect x="140" y="0" width="36" height="36" rx="10" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-opacity="0.4" />
        <text x="150" y="23" fill="#2DD4BF" font-size="12" font-weight="800">KV</text>
      </g>

      <!-- Main Stage View Content -->
      <g transform="translate(240, 0)">
        
      <g transform="translate(32, 80)">
        <!-- Glass Profile Header Card -->
        <rect width="728" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        
        <!-- Centered Avatar (80x80) with 1px Corner Verification Badge -->
        <g transform="translate(324, 20)">
          <rect width="80" height="80" rx="24" fill="#0D9488" />
          <text x="40" y="48" fill="#FFFFFF" font-size="24" font-weight="900" text-anchor="middle" dominant-baseline="middle">DR</text>
          <!-- Overlapping Corner Shield Badge (Center within 1px of avatar corner) -->
          <circle cx="76" cy="76" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
          <text x="76" y="80" fill="#FFFFFF" font-size="11" font-weight="900" text-anchor="middle">✓</text>
        </g>

        <!-- Display Name & Vertically Aligned @username -->
        <text x="364" y="124" fill="#0F172A" font-size="26" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Dr. Ananya Roy</text>
        <g transform="translate(364, 146)">
          <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="0" y="4" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle" font-family="monospace">@kind_volunteer</text>
        </g>
        
        <!-- Verification & Role Chips -->
        <g transform="translate(364, 176)">
          <rect x="-80" y="-10" width="76" height="20" rx="10" fill="#10B981" fill-opacity="0.15" />
          <text x="-42" y="4" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">✓ Verified</text>
          
          <rect x="4" y="-10" width="76" height="20" rx="10" fill="#0D9488" fill-opacity="0.15" />
          <text x="42" y="4" fill="#0D9488" font-size="10" font-weight="700" text-anchor="middle">Doctor</text>
        </g>
      </g>

      <!-- 4 Single-Source-of-Truth Stat Tiles -->
      <g transform="translate(32, 280)">
        
            <g transform="translate(0, 0)">
              <rect width="173" height="76" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
              <text x="16" y="32" fill="#0F172A" font-size="18" font-weight="900" font-family="system-ui, sans-serif">5</text>
              <text x="16" y="52" fill="#0F172A" font-size="11" font-weight="700">Helps Given</text>
              <text x="16" y="66" fill="#64748B" font-size="10">completed acts</text>
            </g>
          
            <g transform="translate(185, 0)">
              <rect width="173" height="76" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
              <text x="16" y="32" fill="#0F172A" font-size="18" font-weight="900" font-family="system-ui, sans-serif">1</text>
              <text x="16" y="52" fill="#0F172A" font-size="11" font-weight="700">Requests</text>
              <text x="16" y="66" fill="#64748B" font-size="10">open request</text>
            </g>
          
            <g transform="translate(370, 0)">
              <rect width="173" height="76" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
              <text x="16" y="32" fill="#0F172A" font-size="18" font-weight="900" font-family="system-ui, sans-serif">1.8h</text>
              <text x="16" y="52" fill="#0F172A" font-size="11" font-weight="700">Hours Active</text>
              <text x="16" y="66" fill="#64748B" font-size="10">community aid</text>
            </g>
          
            <g transform="translate(555, 0)">
              <rect width="173" height="76" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
              <text x="16" y="32" fill="#0F172A" font-size="18" font-weight="900" font-family="system-ui, sans-serif">5.0 ★</text>
              <text x="16" y="52" fill="#0F172A" font-size="11" font-weight="700">Trust Score</text>
              <text x="16" y="66" fill="#64748B" font-size="10">5 reviews</text>
            </g>
          
      </g>

      <!-- Sticky Tab Navigation Strip -->
      <g transform="translate(32, 380)">
        <rect width="728" height="44" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
        <g transform="translate(6, 6)">
          <rect width="96" height="32" rx="12" fill="#0D9488" />
          <text x="48" y="20" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Overview</text>

          <g transform="translate(104, 0)">
            <text x="48" y="20" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">Activity (6)</text>
          </g>

          <g transform="translate(208, 0)">
            <text x="48" y="20" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">Badges (5)</text>
          </g>

          <g transform="translate(312, 0)">
            <text x="48" y="20" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">Impact</text>
          </g>
        </g>
      </g>

      <!-- Overview Content: Bio & Emergency Contacts -->
      <g transform="translate(32, 444)">
        <!-- Bio Card -->
        <rect width="728" height="90" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="16" y="28" fill="#0F172A" font-size="12" font-weight="700">Community Bio</text>
        <text x="16" y="50" fill="#64748B" font-size="11">Emergency doctor at Asansol District Hospital. Available for urgent night triage.</text>
        <text x="16" y="70" fill="#0D9488" font-size="11" font-weight="700">📍 Asansol West · 500/500</text>

        <!-- Emergency Contacts Section (Max 3, Safe Zone) -->
        <g transform="translate(0, 106)">
          <rect width="728" height="100" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="16" y="28" fill="#0F172A" font-size="12" font-weight="700">Registered Emergency Contacts (2 / 3)</text>
          <text x="16" y="46" fill="#64748B" font-size="10">SOS alerts transmit live location to these contacts in one tap</text>
          
          <rect x="16" y="58" width="342" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="26" y="78" fill="#0F172A" font-size="11" font-weight="600">👤 Rajesh Roy (Spouse)</text>

          <rect x="370" y="58" width="342" height="32" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="380" y="78" fill="#0F172A" font-size="11" font-weight="600">👤 Priya Sen (Neighbour)</text>
        </g>
      </g>
    
      </g>

      <!-- Mobile Bottom Tab Bar (<768px) with pb-36 clearance buffer -->
      
    </svg>
  