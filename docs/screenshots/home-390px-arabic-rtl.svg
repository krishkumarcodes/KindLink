
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 820" width="390" height="820" dir="rtl" fill="none">
      <defs>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#0F766E" />
          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
      </defs>

      <!-- Canvas Background -->
      <rect width="390" height="820" fill="#070c17" />

      <!-- Desktop Sidebar (>=1024px) -->
      

      <!-- Top Header (Height 64px) -->
      <rect width="390" height="64" fill="#0a101f" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(12, 14)">
        <rect width="36" height="36" rx="10" fill="url(#headerGrad)" />
        <circle cx="18" cy="18" r="6" fill="#FFFFFF" />
        
        <text x="44" y="24" fill="#F8FAFC" font-size="16" font-weight="800" font-family="system-ui, sans-serif">
          Kind<tspan fill="#0D9488">Link</tspan>
        </text>

        <!-- Location Chip -->
        <g transform="translate(122, 4)">
          <rect width="68" height="28" rx="14" fill="#111c30" stroke="#1f2d48" />
          <circle cx="12" cy="14" r="3" fill="#10B981" />
          <text x="22" y="18" fill="#F8FAFC" font-size="10" font-weight="600">Asansol</text>
        </g>
      </g>

      <!-- Right Header Actions (Fit tested at 360px) -->
      <g transform="translate(238, 14)">
        <!-- SOS Circle -->
        <circle cx="18" cy="18" r="18" fill="#DC2626" />
        <circle cx="18" cy="18" r="22" stroke="#DC2626" stroke-opacity="0.3" stroke-width="2" />
        <text x="9" y="22" fill="#FFFFFF" font-size="9" font-weight="900">SOS</text>

        <!-- Language Button -->
        <rect x="42" y="0" width="32" height="36" rx="10" fill="#111c30" stroke="#1f2d48" />
        <text x="49" y="22" fill="#F8FAFC" font-size="11" font-weight="800">AR</text>

        <!-- Notifications Bell -->
        <rect x="78" y="0" width="36" height="36" rx="10" fill="#111c30" stroke="#1f2d48" />
        <circle cx="96" cy="18" r="7" fill="#64748B" />
        <circle cx="104" cy="10" r="4" fill="#EF4444" />

        <!-- Avatar -->
        <rect x="118" y="0" width="36" height="36" rx="10" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-opacity="0.4" />
        <text x="128" y="23" fill="#2DD4BF" font-size="12" font-weight="800">KV</text>
      </g>

      <!-- Main Stage View Content -->
      <g transform="translate(0, 0)">
        
      <!-- Greeting Banner -->
      <g transform="translate(16, 80)">
        <rect width="358" height="210" rx="24" fill="#131d31" stroke="#1f2d48" stroke-width="1.5" />
        <rect x="16" y="16" width="140" height="24" rx="12" fill="#0D9488" fill-opacity="0.15" />
        <text x="24" y="32" fill="#2DD4BF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Help is just next door</text>
        
        <text x="16" y="68" fill="#F8FAFC" font-size="20" font-weight="800" font-family="system-ui, sans-serif">مرحبًا يا صديق 🙏</text>
        <text x="16" y="94" fill="#94A3B8" font-size="12" font-family="system-ui, sans-serif">Asansol, West Bengal · 48 verified local helpers nearby</text>
        
        <!-- Action Buttons (Ask for Help, Emergency SOS) -->
        <g transform="translate(16, 120)">
          <rect width="157" height="48" rx="16" fill="#0D9488" />
          <text x="24" y="29" fill="#FFFFFF" font-size="13" font-weight="700" font-family="system-ui, sans-serif">طلب مساعدة</text>
          
          <rect x="169" width="157" height="48" rx="16" fill="#DC2626" />
          <text x="187" y="29" fill="#FFFFFF" font-size="13" font-weight="700" font-family="system-ui, sans-serif">طوارئ SOS</text>
        </g>
      </g>

      <!-- Realtime Community Pulse (4 Cards Grid) -->
      <g transform="translate(16, 310)">
        <text x="0" y="0" fill="#F8FAFC" font-size="12" font-weight="800" letter-spacing="1">REALTIME COMMUNITY PULSE</text>
        <rect x="180" y="-10" width="46" height="18" rx="9" fill="#10B981" fill-opacity="0.2" />
        <circle cx="190" cy="-1" r="3" fill="#10B981" />
        <text x="198" y="3" fill="#34D399" font-size="9" font-weight="800">LIVE</text>

        <!-- 4 Grid Cards -->
        <g transform="translate(0, 16)">
          
              <g transform="translate(0, 0)">
                <rect width="173" height="76" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
                <circle cx="24" cy="28" r="14" fill="#10B981" fill-opacity="0.15" />
                <text x="46" y="33" fill="#F8FAFC" font-size="18" font-weight="800" font-family="system-ui, sans-serif">48</text>
                <text x="16" y="58" fill="#94A3B8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Helpers Nearby</text>
              </g>
            
              <g transform="translate(185, 0)">
                <rect width="173" height="76" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
                <circle cx="24" cy="28" r="14" fill="#F59E0B" fill-opacity="0.15" />
                <text x="46" y="33" fill="#F8FAFC" font-size="18" font-weight="800" font-family="system-ui, sans-serif">8 min</text>
                <text x="16" y="58" fill="#94A3B8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Avg. Response</text>
              </g>
            
              <g transform="translate(0, 88)">
                <rect width="173" height="76" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
                <circle cx="24" cy="28" r="14" fill="#06B6D4" fill-opacity="0.15" />
                <text x="46" y="33" fill="#F8FAFC" font-size="18" font-weight="800" font-family="system-ui, sans-serif">1,240</text>
                <text x="16" y="58" fill="#94A3B8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Acts of Help</text>
              </g>
            
              <g transform="translate(185, 88)">
                <rect width="173" height="76" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
                <circle cx="24" cy="28" r="14" fill="#6366F1" fill-opacity="0.15" />
                <text x="46" y="33" fill="#F8FAFC" font-size="18" font-weight="800" font-family="system-ui, sans-serif">99.4%</text>
                <text x="16" y="58" fill="#94A3B8" font-size="11" font-weight="600" font-family="system-ui, sans-serif">Trust Match</text>
              </g>
            
        </g>
      </g>

      <!-- Urgent Needs Section -->
      <g transform="translate(16, 520)">
        <text x="0" y="0" fill="#F8FAFC" font-size="13" font-weight="800">URGENT NEEDS NEARBY (ZERO WEIGHT LABELS)</text>
        
          <g transform="translate(0, 20)">
            <rect width="358" height="72" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
            <rect x="14" y="14" width="94" height="20" rx="10" fill="#EF4444" fill-opacity="0.2" />
            <text x="20" y="28" fill="#EF4444" font-size="10" font-weight="700">Critical Urgency</text>
            <text x="116" y="28" fill="#F8FAFC" font-size="12" font-weight="700">طلب عاجل للتبرع بالدم للعمليات</text>
            <text x="14" y="54" fill="#94A3B8" font-size="11">📍 Asansol District Hospital · 1.2 km · Waiting 12 min</text>
          </g>
        
          <g transform="translate(0, 102)">
            <rect width="358" height="72" rx="18" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
            <rect x="14" y="14" width="94" height="20" rx="10" fill="#F59E0B" fill-opacity="0.2" />
            <text x="20" y="28" fill="#F59E0B" font-size="10" font-weight="700">High Priority</text>
            <text x="116" y="28" fill="#F8FAFC" font-size="12" font-weight="700">مرافقة نقل إلى المستشفى</text>
            <text x="14" y="54" fill="#94A3B8" font-size="11">📍 Asansol District Hospital · 2.5 km · Waiting 12 min</text>
          </g>
        
      </g>
    
      </g>

      <!-- Mobile Bottom Tab Bar (<768px) with pb-36 clearance buffer -->
      
        <g transform="translate(0, 752)">
          <rect width="390" height="68" fill="#0a101f" stroke="#1e293b" stroke-width="1" />
          
          <text x="39" y="42" fill="#2DD4BF" font-size="10" font-weight="700">Home</text>
          <text x="109.20000000000002" y="42" fill="#64748B" font-size="10" font-weight="600">Map</text>
          
          <!-- Raised + Action Button (76px diameter safe zone) -->
          <circle cx="195" cy="12" r="24" fill="#0D9488" stroke="#0a101f" stroke-width="4" />
          <text x="189" y="19" fill="#FFFFFF" font-size="22" font-weight="400">+</text>
          
          <text x="265.20000000000005" y="42" fill="#64748B" font-size="10" font-weight="600">Requests</text>
          <text x="335.4" y="42" fill="#64748B" font-size="10" font-weight="600">Profile</text>
        </g>
      
    </svg>
  