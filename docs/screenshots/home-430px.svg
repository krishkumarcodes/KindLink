      <!-- Realtime Community Pulse (Row A, Row B, Row C, and 4 Cards) -->
      <g transform="translate(16, 310)">
        <!-- Row A: Title & 44x44 Refresh Button on the same row, never wrapping -->
        <g transform="translate(0, 0)">
