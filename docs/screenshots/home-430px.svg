            <text x="322" y="59" fill="#FFFFFF" font-size="11" font-weight="700">I Can Help</text>
          </g>
        
          <g transform="translate(0, 118)">
            <rect width="398" height="76" rx="20" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
            <rect x="14" y="14" width="70" height="22" rx="11" fill="#F59E0B" fill-opacity="0.15" />
            <text x="22" y="29" fill="#F59E0B" font-size="10" font-weight="800">High</text>
            <text x="94" y="29" fill="#F8FAFC" font-size="12" font-weight="700">Hospital transit escort</text>
            <text x="14" y="56" fill="#94A3B8" font-size="11">📍 Asansol District Hospital · 2.5 km · Waiting 12m</text>
            
            <!-- Help action buttons -->
            <rect x="306" y="42" width="78" height="26" rx="10" fill="#0D9488" />
            <text x="322" y="59" fill="#FFFFFF" font-size="11" font-weight="700">I Can Help</text>
          </g>
        
      </g>

      <!-- How KindLink Works Collapsible Card (Remembers state in localStorage) -->
      <g transform="translate(16, 880)">
        <rect width="398" height="120" rx="24" fill="#111c30" stroke="#1f2d48" stroke-width="1.2" />
        <circle cx="36" cy="38" r="16" fill="#0D9488" fill-opacity="0.15" />
        <text x="28" y="44" fill="#0D9488" font-size="16" font-weight="800">✓</text>
        <text x="64" y="34" fill="#F8FAFC" font-size="14" font-weight="800">How KindLink Works</text>
        <rect x="210" y="22" width="56" height="18" rx="9" fill="#0D9488" fill-opacity="0.15" />
        <text x="218" y="35" fill="#0D9488" font-size="10" font-weight="800">3 steps</text>
        <text x="64" y="52" fill="#94A3B8" font-size="11">Neighbours helping neighbours, free for everyone</text>
        
        <!-- 3-Step Overview -->
        <g transform="translate(24, 76)">
          <text x="0" y="16" fill="#F8FAFC" font-size="11" font-weight="700">1. Ask for help</text>
          <text x="131.34" y="16" fill="#F8FAFC" font-size="11" font-weight="700">2. Neighbours alerted</text>
          <text x="270.64000000000004" y="16" fill="#F8FAFC" font-size="11" font-weight="700">3. Safe delivery</text>
        </g>
      </g>
    
      </g>

      <!-- Mobile Bottom Tab Bar (<768px) with pb-36 clearance buffer -->
      
        <g transform="translate(0, 1092)">
          <rect width="430" height="68" fill="#0a101f" stroke="#1e293b" stroke-width="1" />
          
          <text x="43" y="42" fill="#2DD4BF" font-size="10" font-weight="700">Home</text>
          <text x="120.4" y="42" fill="#64748B" font-size="10" font-weight="600">Map</text>
          
          <!-- Raised + Action Button (76px diameter safe zone) -->
          <circle cx="215" cy="12" r="24" fill="#0D9488" stroke="#0a101f" stroke-width="4" />
          <text x="209" y="19" fill="#FFFFFF" font-size="22" font-weight="400">+</text>
          
          <text x="292.40000000000003" y="42" fill="#64748B" font-size="10" font-weight="600">Requests</text>
          <text x="369.8" y="42" fill="#64748B" font-size="10" font-weight="600">Profile</text>
