          <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>
      </defs>

      <!-- Canvas Background -->
      <rect width="430" height="1160" fill="#070c17" />

      <!-- Desktop Sidebar (>=1024px) -->
      

      <!-- Top Header (Height 64px) -->
      <rect width="430" height="64" fill="#0a101f" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(12, 14)">
        <rect width="36" height="36" rx="10" fill="url(#headerGrad)" />
        <circle cx="18" cy="18" r="6" fill="#FFFFFF" />
        
        <text x="44" y="24" fill="#F8FAFC" font-size="16" font-weight="800" font-family="system-ui, sans-serif">
          Kind<tspan fill="#0D9488">Link</tspan>
        </text>

        <!-- Location Chip -->
        <g transform="translate(122, 4)">
          <rect width="68" height="28" rx="14" fill="#111c30" stroke="#1f2d48" />
