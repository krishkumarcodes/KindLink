
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1160" width="430" height="1160" dir="ltr" fill="none">
      <defs>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
