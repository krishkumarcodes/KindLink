<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 44" width="184" height="44" fill="none">
  <defs>
    <!-- Background Gradient for Icon Squircle -->
    <linearGradient id="kl-mark-grad" x1="2" y1="2" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="35%" stop-color="#0D9488"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Beacon Radial Gradient -->
    <radialGradient id="kl-beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="kl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft Drop Shadow Filter for Mark Base -->
    <filter id="kl-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F766E" flood-opacity="0.3"/>
    </filter>

    <!-- Responsive Dark/Light Scheme Support -->
    <style>
      .kl-brand-text {
        font-family: 'Plus Jakarta Sans', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .kl-txt-kind {
        fill: #0F172A;
      }
      .kl-txt-link {
        fill: #0D9488;
      }
      .kl-txt-sub {
        fill: #64748B;
      }
      @media (prefers-color-scheme: dark) {
        .kl-txt-kind {
          fill: #F8FAFC;
        }
        .kl-txt-link {
          fill: #14B8A6;
        }
        .kl-txt-sub {
          fill: #94A3B8;
        }
      }
    </style>
  </defs>

  <!-- Squircle Base with Elevation -->
  <g filter="url(#kl-shadow)">
    <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#kl-mark-grad)"/>
    <rect x="2.5" y="2.5" width="39" height="39" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Antigravity Physics Orbitals & Heart Nexus inside Branding Mark -->
  <g transform="translate(22, 22) scale(0.625) translate(-32, -32)">
    <!-- Orbital Antigravity Field Rings (Newtonian Aid Gravity) -->
    <ellipse cx="32" cy="32" rx="22" ry="11" transform="rotate(-25 32 32)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="4 2"/>
    <ellipse cx="32" cy="32" rx="22" ry="11" transform="rotate(25 32 32)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="32" cy="32" r="18" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- Connected Hearts & Hands Mobius Loop (KindLink Emblem) -->
    <path d="M22 28 C18 22, 12 25, 12 32 C12 39, 24 46, 32 50 C40 46, 52 39, 52 32 C52 25, 46 22, 42 28 C39 32, 35 34, 32 34 C29 34, 25 32, 22 28 Z" fill="#FFFFFF" fill-opacity="0.96"/>

    <!-- Secondary Inner Link Arch -->
    <path d="M23.5 30 C26 33, 29 34.5, 32 34.5 C35 34.5, 38 33, 40.5 30" stroke="#0D9488" stroke-width="2" stroke-linecap="round"/>

    <!-- Quantum Core Pulse / Beacon -->
    <circle cx="32" cy="32" r="5" fill="url(#kl-beacon)" filter="url(#kl-glow)"/>
    <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Clean Typography Block -->
  <g id="brand-typography">
    <!-- KindLink Brand Wordmark -->
    <text x="50" y="26" class="kl-brand-text" font-size="22" font-weight="800" letter-spacing="-0.03em">
      <tspan class="kl-txt-kind">Kind</tspan><tspan class="kl-txt-link">Link</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="51" y="38" class="kl-brand-text kl-txt-sub" font-size="7.5" font-weight="700" letter-spacing="0.16em">
      MUTUAL AID NETWORK
    </text>

    <!-- Physics Aid Orbit Accent Point -->
    <circle cx="166" cy="16" r="2.5" fill="#06B6D4" opacity="0.85"/>
    <circle cx="166" cy="16" r="1" fill="#FFFFFF"/>
  </g>
</svg>
