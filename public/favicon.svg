<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kl-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="kl-beacon" x1="28" y1="28" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="kl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kl-grad)"/>

  <!-- Orbital Aid Network Field Rings (Hyperlocal Connection) -->
  <ellipse cx="32" cy="32" rx="22" ry="11" transform="rotate(-25 32 32)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="4 2"/>
  <ellipse cx="32" cy="32" rx="22" ry="11" transform="rotate(25 32 32)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Connected Hearts & Hands Infinity Nexus (KindLink) -->
  <path d="M22 28 C18 22, 12 25, 12 32 C12 39, 24 46, 32 50 C40 46, 52 39, 52 32 C52 25, 46 22, 42 28 C39 32, 35 34, 32 34 C29 34, 25 32, 22 28 Z" fill="#FFFFFF" fill-opacity="0.95"/>

  <!-- Quantum Core Pulse / Beacon -->
  <circle cx="32" cy="32" r="5" fill="url(#kl-beacon)" filter="url(#kl-glow)"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
