<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-hist" x1="30" y1="20" x2="250" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="gold-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="hist-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10B981" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="140" cy="100" r="75" fill="url(#bg-grad-hist)"/>

  <!-- Halo orbit rings -->
  <ellipse cx="140" cy="100" rx="95" ry="42" transform="rotate(-15 140 100)" stroke="#10B981" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Medal / Shield Core -->
  <g transform="translate(95, 45)" filter="url(#hist-shadow)">
    <!-- Hexagonal / Shield Container -->
    <path d="M45 10 L80 25 L80 65 C80 88 45 105 45 105 C45 105 10 88 10 65 L10 25 Z" fill="#FFFFFF" fill-opacity="0.95" stroke="#10B981" stroke-width="2"/>
    <path d="M45 18 L73 30 L73 63 C73 82 45 96 45 96 C45 96 17 82 17 63 L17 30 Z" fill="url(#bg-grad-hist)"/>

    <!-- Hands clasped / Heart Icon inside badge -->
    <circle cx="45" cy="52" r="20" fill="url(#emerald-glow)"/>
    <!-- Heart Symbol -->
    <path d="M45 59 C40.5 55 36 51.5 36 47.5 C36 45 38 43 40.5 43 C42.3 43 44 44 45 45.5 C46 44 47.7 43 49.5 43 C52 43 54 45 54 47.5 C54 51.5 49.5 55 45 59 Z" fill="#FFFFFF"/>
  </g>

  <!-- Floating Star Badges -->
  <g transform="translate(60, 60)" filter="url(#hist-shadow)">
    <circle cx="16" cy="16" r="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <polygon points="16,6 19,13 26,13 20.5,17.5 22.5,25 16,20.5 9.5,25 11.5,17.5 6,13 13,13" fill="url(#gold-star)"/>
  </g>

  <g transform="translate(190, 85)" filter="url(#hist-shadow)">
    <circle cx="16" cy="16" r="14" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
    <!-- Checkmark -->
    <path d="M10 16 L14 20 L22 12" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M75 145 L77 150 L82 152 L77 154 L75 159 L73 154 L68 152 L73 150 Z" fill="#10B981"/>
  <path d="M210 50 L211.5 54 L215.5 55.5 L211.5 57 L210 61 L208.5 57 L204.5 55.5 L208.5 54 Z" fill="#E5484D"/>
</svg>
