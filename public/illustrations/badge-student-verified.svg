<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="stud-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="stud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#stud-bg)" filter="url(#stud-shadow)"/>
  <rect x="16" y="16" width="88" height="88" rx="24" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Academic Cap -->
  <g transform="translate(60, 52)">
    <!-- Mortarboard Diamond -->
    <polygon points="0,-16 32,0 0,16 -32,0" fill="#FFFFFF"/>
    <!-- Cap Base -->
    <path d="M-18 8 V16 C-18 22 18 22 18 16 V8 Z" fill="#E6FFFA"/>
    <!-- Tassel -->
    <path d="M22 4 V22 M22 22 L24 28 L20 28 Z" stroke="#FDE047" stroke-width="2.5" fill="#FDE047"/>
  </g>

  <!-- Verified Check Badge -->
  <circle cx="60" cy="84" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M55 84 L58.5 87.5 L65.5 80.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
