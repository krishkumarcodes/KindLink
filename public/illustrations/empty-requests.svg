<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-req" x1="20" y1="20" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="teal-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ambient background glow & circles -->
  <circle cx="140" cy="100" r="75" fill="url(#bg-grad-req)"/>
  <circle cx="65" cy="65" r="8" fill="#10B981" fill-opacity="0.25"/>
  <circle cx="215" cy="135" r="6" fill="#0D9488" fill-opacity="0.3"/>
  <circle cx="205" cy="55" r="4" fill="#E5484D" fill-opacity="0.2"/>

  <!-- Orbit lines representing Hyperlocal Community Outreach -->
  <ellipse cx="140" cy="100" rx="90" ry="45" stroke="#0D9488" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Card Backdrop -->
  <rect x="85" y="45" width="110" height="110" rx="24" fill="#FFFFFF" fill-opacity="0.9" filter="url(#soft-shadow)"/>
  <rect x="85" y="45" width="110" height="110" rx="24" stroke="#0D9488" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Paper Lines / Content placeholder -->
  <rect x="105" y="70" width="70" height="8" rx="4" fill="url(#teal-accent)"/>
  <rect x="105" y="86" width="52" height="6" rx="3" fill="#0D9488" fill-opacity="0.3"/>
  <rect x="105" y="98" width="60" height="6" rx="3" fill="#10B981" fill-opacity="0.25"/>

  <!-- Floating Heart Badge -->
  <g transform="translate(155, 115) scale(0.9)">
    <circle cx="20" cy="20" r="18" fill="url(#teal-accent)" filter="url(#soft-shadow)"/>
    <path d="M20 26.5 C15.5 22.8 11 19.5 11 15.5 C11 13 13 11 15.5 11 C17.3 11 19 12 20 13.5 C21 12 22.7 11 24.5 11 C27 11 29 13 29 15.5 C29 19.5 24.5 22.8 20 26.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Sparkles -->
  <path d="M78 120 L80 125 L85 127 L80 129 L78 134 L76 129 L71 127 L76 125 Z" fill="#10B981"/>
  <path d="M198 42 L199.5 46 L203.5 47.5 L199.5 49 L198 53 L196.5 49 L192.5 47.5 L196.5 46 Z" fill="#0D9488"/>
</svg>
