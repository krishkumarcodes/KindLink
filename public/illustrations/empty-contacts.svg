<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-cont" x1="20" y1="20" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5484D"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="cont-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="140" cy="100" r="75" fill="url(#bg-grad-cont)"/>

  <!-- Network connection lines -->
  <line x1="140" y1="80" x2="85" y2="120" stroke="#0D9488" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="140" y1="80" x2="195" y2="120" stroke="#0D9488" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Center Primary Safety Beacon -->
  <g transform="translate(116, 56)" filter="url(#cont-shadow)">
    <circle cx="24" cy="24" r="24" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="20" fill="url(#rose-grad)"/>
    <!-- Shield / Heart inside -->
    <path d="M24 16 L33 20 L33 26 C33 31 24 35 24 35 C24 35 15 31 15 26 L15 20 Z" fill="#FFFFFF"/>
    <path d="M24 20 L24 28 M20 24 L28 24" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Left Connected Contact Avatar -->
  <g transform="translate(65, 100)" filter="url(#cont-shadow)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="16" fill="url(#teal-grad)"/>
    <!-- User Silhouette -->
    <circle cx="20" cy="16" r="5" fill="#FFFFFF"/>
    <path d="M12 28 C12 24 16 23 20 23 C24 23 28 24 28 28 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Connected Contact Avatar -->
  <g transform="translate(175, 100)" filter="url(#cont-shadow)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="16" fill="#10B981"/>
    <!-- Phone Silhouette -->
    <rect x="15" y="11" width="10" height="18" rx="2" fill="#FFFFFF"/>
    <rect x="17" y="14" width="6" height="11" rx="1" fill="#10B981"/>
    <circle cx="20" cy="27" r="0.8" fill="#FFFFFF"/>
  </g>

  <!-- Plus add icon floating -->
  <g transform="translate(130, 130)" filter="url(#cont-shadow)">
    <circle cx="10" cy="10" r="10" fill="#0D9488"/>
    <path d="M10 6 L10 14 M6 10 L14 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
