<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="fa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#fa-bg)" filter="url(#fa-shadow)"/>
  <rect x="16" y="16" width="88" height="88" rx="24" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Star of Life / First Aid Cross Shield -->
  <circle cx="60" cy="60" r="30" fill="#FFFFFF"/>

  <!-- Emergency Flash / Lightning Cross -->
  <g transform="translate(60, 60)">
    <path d="M-6 -18 H6 V-6 H18 V6 H6 V18 H-6 V6 H-18 V-6 H-6 Z" fill="#D97706"/>
    <path d="M-2 -8 L4 -2 L0 0 L3 8 L-3 2 L0 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- Speed Orbit Rings -->
  <ellipse cx="60" cy="60" rx="38" ry="18" transform="rotate(-30 60 60)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
</svg>
