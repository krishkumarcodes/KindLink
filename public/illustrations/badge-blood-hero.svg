<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="blood-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5484D"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="blood-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E5484D"/>
    </linearGradient>
    <filter id="blood-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E5484D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Base -->
  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#blood-bg)" filter="url(#blood-shadow)"/>
  <rect x="16" y="16" width="88" height="88" rx="24" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Orbital Ring -->
  <circle cx="60" cy="60" r="38" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Blood Droplet Icon with Cross -->
  <g transform="translate(36, 32)">
    <path d="M24 4 C24 4 44 26 44 38 C44 49 35 58 24 58 C13 58 4 49 4 38 C4 26 24 4 24 4 Z" fill="#FFFFFF"/>
    <!-- Medical Plus Inside Droplet -->
    <path d="M24 28 L24 44 M16 36 L32 36" stroke="#E5484D" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Stars -->
  <polygon points="26,24 28,29 33,29 29,32 30.5,37 26,34 21.5,37 23,32 19,29 24,29" fill="#FDE047"/>
  <polygon points="94,24 96,29 101,29 97,32 98.5,37 94,34 89.5,37 91,32 87,29 92,29" fill="#FDE047"/>
</svg>
