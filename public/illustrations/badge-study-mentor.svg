<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="mentor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="mentor-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#mentor-bg)" filter="url(#mentor-shadow)"/>
  <rect x="16" y="16" width="88" height="88" rx="24" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Open Book & Glowing Bulb Motif -->
  <g transform="translate(60, 64)">
    <!-- Open Book Pages -->
    <path d="M0 8 C-10 2 -20 2 -26 6 V-18 C-20 -22 -10 -22 0 -16 C10 -22 20 -22 26 -18 V6 C20 2 10 2 0 8 Z" fill="#FFFFFF"/>
    <path d="M0 -16 V8" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="-20" y1="-10" x2="-6" y2="-6" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-20" y1="-4" x2="-6" y2="0" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="20" y2="-10" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="20" y2="-4" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Idea Star -->
  <circle cx="60" cy="34" r="10" fill="#FDE047"/>
  <path d="M60 20 V24 M60 44 V48 M46 34 H50 M70 34 H74" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
</svg>
