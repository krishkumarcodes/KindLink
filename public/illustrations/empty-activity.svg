<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-act" x1="20" y1="20" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="act-pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="act-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="140" cy="100" r="75" fill="url(#bg-grad-act)"/>

  <!-- Orbital pulse waves -->
  <ellipse cx="140" cy="100" rx="90" ry="40" stroke="#0D9488" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Central Activity Compass / Clock Badge -->
  <g transform="translate(100, 60)" filter="url(#act-shadow)">
    <rect x="0" y="0" width="80" height="80" rx="24" fill="#FFFFFF"/>
    <rect x="0" y="0" width="80" height="80" rx="24" stroke="#0D9488" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Clock Face / Activity Ring -->
    <circle cx="40" cy="40" r="26" fill="url(#act-pulse)"/>
    <circle cx="40" cy="40" r="21" fill="#FFFFFF"/>

    <!-- Clock hands -->
    <line x1="40" y1="40" x2="40" y2="27" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="40" x2="49" y2="40" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="3" fill="#0D9488"/>
  </g>

  <!-- Activity pulse dots -->
  <circle cx="65" cy="85" r="5" fill="#10B981"/>
  <circle cx="215" cy="115" r="5" fill="#E5484D"/>
</svg>
