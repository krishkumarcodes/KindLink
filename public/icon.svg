<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwa-bg" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="25%" stop-color="#0D9488"/>
      <stop offset="65%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Top-Light Specular Rim Gradient -->
    <linearGradient id="pwa-rim" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Beacon Radial Gradient -->
    <radialGradient id="pwa-beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>

    <!-- Shadow filter for base -->
    <filter id="pwa-base-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#042F2E" flood-opacity="0.38"/>
    </filter>

    <!-- Shadow filter for emblem -->
    <filter id="pwa-emblem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#042F2E" flood-opacity="0.28"/>
    </filter>

    <!-- Glow filter for beacon -->
    <filter id="pwa-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Elevation & Precision Rim -->
  <rect x="32" y="32" width="448" height="448" rx="124" fill="url(#pwa-bg)" filter="url(#pwa-base-shadow)"/>
  <rect x="34" y="34" width="444" height="444" rx="122" stroke="url(#pwa-rim)" stroke-width="5"/>

  <!-- Radar Orbitals (Precision Concentric Rings) -->
  <circle cx="256" cy="256" r="195" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="24 16"/>
  <circle cx="256" cy="256" r="150" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="205" ry="108" transform="rotate(-26 256 256)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12" stroke-dasharray="28 14" stroke-linecap="round"/>
  <ellipse cx="256" cy="256" rx="205" ry="108" transform="rotate(26 256 256)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12" stroke-dasharray="28 14" stroke-linecap="round"/>

  <!-- Rebranded Interlocking Heart-Link Emblem -->
  <g filter="url(#pwa-emblem-shadow)">
    <!-- Main Mobius Heart-Link Body -->
    <path d="M 180 200
             C 125 145, 78 200, 78 262
             C 78 325, 155 388, 256 428
             C 357 388, 434 325, 434 262
             C 434 200, 387 145, 332 200
             C 295 238, 256 280, 256 280
             C 256 280, 217 238, 180 200 Z"
          fill="#FFFFFF"
          fill-opacity="0.97"/>

    <!-- Inner Dimension Notch -->
    <path d="M 198 222 C 228 260, 256 290, 256 290 C 256 290, 284 260, 314 222"
          stroke="#0D9488"
          stroke-width="18"
          stroke-linecap="round"/>
  </g>

  <!-- Central Emergency Beacon Pulse -->
  <circle cx="256" cy="245" r="44" fill="url(#pwa-beacon)" filter="url(#pwa-glow)"/>
  <circle cx="256" cy="245" r="16" fill="#FFFFFF"/>
</svg>
