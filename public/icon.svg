<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwa-bg" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="28%" stop-color="#0D9488"/>
      <stop offset="65%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Beacon Radial Gradient -->
    <radialGradient id="pwa-beacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>

    <!-- Shadow filter for base -->
    <filter id="pwa-base-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#042F2E" flood-opacity="0.36"/>
    </filter>

    <!-- Shadow filter for emblem -->
    <filter id="pwa-emblem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042F2E" flood-opacity="0.25"/>
    </filter>

    <!-- Glow filter for beacon -->
    <filter id="pwa-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Elevation -->
  <rect x="32" y="32" width="448" height="448" rx="124" fill="url(#pwa-bg)" filter="url(#pwa-base-shadow)"/>
  <rect x="34" y="34" width="444" height="444" rx="122" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="4"/>

  <!-- Radar Orbitals (Precision Concentric Rings) -->
  <circle cx="256" cy="256" r="195" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-dasharray="24 16"/>
  <circle cx="256" cy="256" r="150" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="200" ry="105" transform="rotate(-28 256 256)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12" stroke-dasharray="28 14" stroke-linecap="round"/>
  <ellipse cx="256" cy="256" rx="200" ry="105" transform="rotate(28 256 256)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12" stroke-dasharray="28 14" stroke-linecap="round"/>

  <!-- Rebranded Interlocking Heart-Link Emblem -->
  <g filter="url(#pwa-emblem-shadow)">
    <!-- Main Mobius Heart-Link Body -->
    <path d="M 180 205
             C 125 150, 80 205, 80 265
             C 80 325, 155 385, 256 425
             C 357 385, 432 325, 432 265
             C 432 205, 387 150, 332 205
             C 297 240, 256 280, 256 280
             C 256 280, 215 240, 180 205 Z"
          fill="#FFFFFF"
          fill-opacity="0.96"/>

    <!-- Inner Dimension Notch -->
    <path d="M 200 225 C 230 262, 256 290, 256 290 C 256 290, 282 262, 312 225"
          stroke="#0D9488"
          stroke-width="18"
          stroke-linecap="round"/>
  </g>

  <!-- Central Emergency Beacon Pulse -->
  <circle cx="256" cy="250" r="42" fill="url(#pwa-beacon)" filter="url(#pwa-glow)"/>
  <circle cx="256" cy="250" r="16" fill="#FFFFFF"/>
</svg>
